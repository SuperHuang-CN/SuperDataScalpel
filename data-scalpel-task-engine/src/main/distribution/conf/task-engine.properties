# HTTP daemon
task.engine.host=0.0.0.0
task.engine.port=8091
task.engine.http.executor-threads=8
task.engine.http.max-request-bytes=10485760

# Compilation capacity
task.engine.compile.max-concurrency=2
task.engine.compile.acquire-timeout-seconds=10
task.engine.compile.timeout-seconds=30

# Spark defaults. spark.master and spark.app.name are only used when spark-submit has not set them.
spark.master=local[*]
spark.app.name=DataScalpel Task Engine
spark.ui.enabled=false
spark.sql.shuffle.partitions=4
spark.sql.caseSensitive=true
spark.sql.ansi.enabled=true
spark.sql.session.timeZone=UTC

# DATASCALPEL_TASK_ENGINE_TOKEN is required and intentionally has no file default.
