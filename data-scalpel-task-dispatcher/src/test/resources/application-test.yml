spring:
  datasource:
    url: jdbc:h2:mem:task_dispatcher;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS dispatcher\;SET SCHEMA dispatcher
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql.init.mode: never
  jpa:
    hibernate.ddl-auto: create-drop
    properties.hibernate.default_schema: dispatcher

data-scalpel:
  dispatcher:
    token: test-dispatcher-token
    backend: LOCAL_DOCKER
    admission-poll-interval: 10s
    observation-poll-interval: 10s
    outbox-poll-interval: 10s
