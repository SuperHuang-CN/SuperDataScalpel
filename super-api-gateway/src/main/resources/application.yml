server:
  port: ${SUPER_API_GATEWAY_SERVER_PORT:19000}

spring:
  application:
    name: super-api-gateway
  main:
    web-application-type: reactive
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          routes: []
  datasource:
    url: ${SUPER_API_GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/data_scalpel}
    username: ${SUPER_API_GATEWAY_DB_USERNAME:postgres}
    password: ${SUPER_API_GATEWAY_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SUPER_API_GATEWAY_DB_POOL_SIZE:12}
      minimum-idle: ${SUPER_API_GATEWAY_DB_MIN_IDLE:2}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: super_api_gateway
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${SUPER_API_GATEWAY_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      acks: 1
      compression-type: lz4
      properties:
        linger.ms: 50
        batch.size: 65536
        max.block.ms: 100
        delivery.timeout.ms: 10000

super-api-gateway:
  public-base-url: ${SUPER_API_GATEWAY_PUBLIC_BASE_URL:http://localhost:19000}
  admin:
    username: ${SUPER_API_GATEWAY_ADMIN_USERNAME:admin}
    password: ${SUPER_API_GATEWAY_ADMIN_PASSWORD:admin123456}
    jwt-secret: ${SUPER_API_GATEWAY_JWT_SECRET:change-me-super-api-gateway-jwt-secret-32-bytes}
    jwt-issuer: ${SUPER_API_GATEWAY_JWT_ISSUER:super-api-gateway}
    jwt-ttl: ${SUPER_API_GATEWAY_JWT_TTL:8h}
    machine-token: ${SUPER_API_GATEWAY_MACHINE_TOKEN:change-me-super-api-gateway-machine-token}
  control-plane:
    core-threads: ${SUPER_API_GATEWAY_CONTROL_CORE_THREADS:4}
    max-threads: ${SUPER_API_GATEWAY_CONTROL_MAX_THREADS:16}
    queue-capacity: ${SUPER_API_GATEWAY_CONTROL_QUEUE_CAPACITY:200}
  runtime:
    reload-threads: ${SUPER_API_GATEWAY_RELOAD_THREADS:2}
    revision-poll-interval: ${SUPER_API_GATEWAY_REVISION_POLL_INTERVAL:5s}
    heartbeat-interval: ${SUPER_API_GATEWAY_HEARTBEAT_INTERVAL:10s}
    instance-stale-after: ${SUPER_API_GATEWAY_INSTANCE_STALE_AFTER:30s}
  access-log:
    enabled: ${SUPER_API_GATEWAY_ACCESS_LOG_ENABLED:true}
    topic: ${SUPER_API_GATEWAY_ACCESS_LOG_TOPIC:super-api-gateway.access-log.v1}
    queue-capacity: ${SUPER_API_GATEWAY_ACCESS_LOG_QUEUE_CAPACITY:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

info:
  application:
    name: ${spring.application.name}
    version: '@project.version@'
