x-kong-database: &kong-database
  KONG_DATABASE: postgres
  KONG_PG_HOST: ${KONG_PG_HOST:-10.0.0.5}
  KONG_PG_PORT: ${KONG_PG_PORT:-5432}
  KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong_test69}
  KONG_PG_USER: ${KONG_PG_USER:-kong_test69}
  KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: datascalpel-test69-kafka
    restart: unless-stopped
    ports:
      - "10.0.0.69:19094:19094"
    volumes:
      - /data/datascalpel-test69/infra/kafka:/var/lib/kafka/data:Z
    environment:
      TZ: Asia/Shanghai
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://10.0.0.69:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@datascalpel-test69-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: EXTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19094 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    networks:
      test69:
        ipv4_address: 172.30.69.10

  kong-migrations:
    image: kong:3.9.3
    container_name: datascalpel-test69-kong-migrations
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - kong migrations bootstrap || (kong migrations up && kong migrations finish)
    environment:
      <<: *kong-database
      TZ: Asia/Shanghai
    networks:
      test69:
        ipv4_address: 172.30.69.11

  kong:
    image: kong:3.9.3
    container_name: datascalpel-test69-kong
    restart: unless-stopped
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    ports:
      - "10.0.0.69:18000:8000"
      - "127.0.0.1:18003:8001"
      - "127.0.0.1:18100:8100"
    environment:
      <<: *kong-database
      TZ: Asia/Shanghai
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_LOG_LEVEL: notice
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 1g
    cpus: 1
    networks:
      test69:
        ipv4_address: 172.30.69.12

networks:
  test69:
    name: datascalpel-test69-infra
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.69.0/24
