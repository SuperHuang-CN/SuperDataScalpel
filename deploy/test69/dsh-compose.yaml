services:
  dsh:
    image: datascalpel-dsh:0.1.5-rc.1
    container_name: datascalpel-test69-dsh
    init: true
    restart: unless-stopped
    user: root
    environment:
      TZ: Asia/Shanghai
      DSH_PERMISSION_MODE: workspace-write
      DSH_ADMIN_ENABLED: "true"
      DSH_ADMIN_MCP_URL: http://host.docker.internal:18080/system-mcp
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export DATASCALPEL_DSH_ADMIN_BRIDGE_TOKEN="$$(cat /run/secrets/dsh-admin-bridge-token)"
        exec dsh web --patch /opt/dsh-config/docker.cordis.patch.yml --no-open
    ports:
      - "10.0.0.69:13080:13080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const socket=require('node:net').connect(13080,'127.0.0.1');socket.setTimeout(4000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 4
    volumes:
      - /data/datascalpel-test69/dsh/home:/home/node/.dsh:Z
      - /data/datascalpel-test69/dsh/workspace:/workspace:Z
      - /data/datascalpel-test69/config/dsh-admin-bridge-token:/run/secrets/dsh-admin-bridge-token:ro,Z
      - /data/SuperDataScalpel/skills:/workspace/skills:ro,Z
      - /data/SuperDataScalpel/deploy/dsh/docker.cordis.patch.yml:/opt/dsh-config/docker.cordis.patch.yml:ro,Z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    mem_limit: 4g
    cpus: 2
    networks:
      test69_dsh:
        ipv4_address: 172.30.70.10

networks:
  test69_dsh:
    name: datascalpel-test69-dsh
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.70.0/24
