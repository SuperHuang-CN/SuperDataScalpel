services:
  datascalpel-compute-engine:
    image: ${COMPUTE_ENGINE_RUNTIME_IMAGE}
    container_name: datascalpel-compute-engine
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["-jar", "${DATASCALPEL_TASK_DISPATCHER_APP_JAR}"]
    ports:
      - "${COMPUTE_ENGINE_BIND_ADDRESS:-10.0.0.69}:18092:18092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${COMPUTE_ENGINE_ROOT:-/data/datascalpel-compute-engine}/releases:${COMPUTE_ENGINE_ROOT:-/data/datascalpel-compute-engine}/releases:ro,z"
      - "${COMPUTE_ENGINE_ROOT:-/data/datascalpel-compute-engine}/state:${COMPUTE_ENGINE_ROOT:-/data/datascalpel-compute-engine}/state:z"
    environment:
      TZ: "${COMPUTE_ENGINE_TIME_ZONE:-Asia/Shanghai}"
      JAVA_TOOL_OPTIONS: "${COMPUTE_ENGINE_JAVA_TOOL_OPTIONS:--Djava.net.preferIPv4Stack=true -Duser.timezone=Asia/Shanghai}"
      DATASCALPEL_TASK_DISPATCHER_PORT: "18092"
      DATASCALPEL_TASK_DISPATCHER_TOKEN: ${DATASCALPEL_TASK_DISPATCHER_TOKEN}
      DATASCALPEL_TASK_DISPATCHER_BACKEND: "LOCAL_DOCKER"
      DATASCALPEL_TASK_DISPATCHER_ENSURE_TOPICS: ${DATASCALPEL_TASK_DISPATCHER_ENSURE_TOPICS:-true}
      DATASCALPEL_DB_URL: ${DATASCALPEL_DB_URL}
      DATASCALPEL_DB_USERNAME: ${DATASCALPEL_DB_USERNAME}
      DATASCALPEL_DB_PASSWORD: ${DATASCALPEL_DB_PASSWORD}
      DATASCALPEL_KAFKA_BOOTSTRAP_SERVERS: ${DATASCALPEL_KAFKA_BOOTSTRAP_SERVERS}
      DATASCALPEL_KAFKA_RUNNER_BOOTSTRAP_SERVERS: ${DATASCALPEL_KAFKA_RUNNER_BOOTSTRAP_SERVERS}
      DATASCALPEL_FILE_STORAGE_ENDPOINT: ${DATASCALPEL_FILE_STORAGE_ENDPOINT}
      DATASCALPEL_FILE_STORAGE_RUNNER_ENDPOINT: ${DATASCALPEL_FILE_STORAGE_RUNNER_ENDPOINT}
      DATASCALPEL_FILE_STORAGE_REGION: ${DATASCALPEL_FILE_STORAGE_REGION:-us-east-1}
      DATASCALPEL_FILE_STORAGE_BUCKET: ${DATASCALPEL_FILE_STORAGE_BUCKET:-datascalpel}
      DATASCALPEL_FILE_STORAGE_ROOT_PREFIX: ${DATASCALPEL_FILE_STORAGE_ROOT_PREFIX:-data-scalpel}
      DATASCALPEL_FILE_STORAGE_ACCESS_KEY: ${DATASCALPEL_FILE_STORAGE_ACCESS_KEY}
      DATASCALPEL_FILE_STORAGE_SECRET_KEY: ${DATASCALPEL_FILE_STORAGE_SECRET_KEY}
      DATASCALPEL_FILE_STORAGE_PATH_STYLE_ACCESS: ${DATASCALPEL_FILE_STORAGE_PATH_STYLE_ACCESS:-true}
      DATASCALPEL_TASK_DISPATCHER_DOCKER_EXECUTABLE: "docker"
      DATASCALPEL_TASK_DISPATCHER_DOCKER_IMAGE: ${DATASCALPEL_TASK_DISPATCHER_DOCKER_IMAGE:-eclipse-temurin:21-jdk}
      DATASCALPEL_TASK_DISPATCHER_DOCKER_PULL: ${DATASCALPEL_TASK_DISPATCHER_DOCKER_PULL:-missing}
      DATASCALPEL_TASK_DISPATCHER_DOCKER_MEMORY: ${DATASCALPEL_TASK_DISPATCHER_DOCKER_MEMORY:-4g}
      DATASCALPEL_TASK_DISPATCHER_DOCKER_CPUS: ${DATASCALPEL_TASK_DISPATCHER_DOCKER_CPUS:-2}
      DATASCALPEL_TASK_DISPATCHER_RUNNER_JAR: ${DATASCALPEL_TASK_DISPATCHER_RUNNER_JAR}
      DATASCALPEL_TASK_DISPATCHER_WORK_DIRECTORY: "${COMPUTE_ENGINE_ROOT:-/data/datascalpel-compute-engine}/state/task-executions"
      DATASCALPEL_TASK_STREAMING_LOCAL_CHECKPOINT_DIRECTORY: "${COMPUTE_ENGINE_ROOT:-/data/datascalpel-compute-engine}/state/task-streaming-checkpoints"
      DATASCALPEL_TASK_DISPATCHER_RUNNER_JAVA_OPTIONS: ${DATASCALPEL_TASK_DISPATCHER_RUNNER_JAVA_OPTIONS:--Xms512m -Xmx3g}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18092/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
