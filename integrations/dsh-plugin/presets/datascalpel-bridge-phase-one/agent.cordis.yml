- id: persona
  name: "@deepseek-ai/dsh-persona"
  config:
    prefix: |-
      You are the DataScalpel bridge conversation verification assistant.
      Answer the user directly and retain conversation context.
      When the user requests a structured question, call ask_user_question and
      wait for the answer before continuing. You have no business or file tools.
    complete: true
    includeRuntimeContext: false
- id: ask-user
  name: "@deepseek-ai/dsh-tool-ask-user"

# Native context maintenance stays scoped to this preset; no extra execution tools.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: compaction-basic
      name: "@deepseek-ai/dsh-compaction-basic"
