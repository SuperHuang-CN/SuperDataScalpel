server:
  port: ${DATASCALPEL_SERVER_PORT:8080}

logging:
  level:
    org.apache.kafka.common.config: WARN

spring:
  kafka:
    bootstrap-servers: ${DATASCALPEL_EXECUTION_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    properties:
      request.timeout.ms: ${DATASCALPEL_KAFKA_REQUEST_TIMEOUT_MS:60000}
      socket.connection.setup.timeout.ms: ${DATASCALPEL_KAFKA_CONNECTION_SETUP_TIMEOUT_MS:30000}
      socket.connection.setup.timeout.max.ms: ${DATASCALPEL_KAFKA_CONNECTION_SETUP_TIMEOUT_MAX_MS:120000}
    admin:
      properties:
        default.api.timeout.ms: ${DATASCALPEL_KAFKA_API_TIMEOUT_MS:120000}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${DATASCALPEL_KAFKA_DELIVERY_TIMEOUT_MS:120000}
        max.block.ms: ${DATASCALPEL_KAFKA_MAX_BLOCK_MS:120000}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        default.api.timeout.ms: ${DATASCALPEL_KAFKA_API_TIMEOUT_MS:120000}
    listener:
      ack-mode: record
  application:
    name: data-scalpel-admin
  servlet:
    multipart:
      max-file-size: ${DATASCALPEL_FILE_MAX_SIZE:1GB}
      max-request-size: ${DATASCALPEL_FILE_MAX_REQUEST_SIZE:1GB}
  datasource:
    url: ${DATASCALPEL_DB_URL:jdbc:postgresql://localhost:5432/data_scalpel}
    username: ${DATASCALPEL_DB_USERNAME:postgres}
    password: ${DATASCALPEL_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  quartz:
    auto-startup: false # TaskRunRecovery starts Quartz after interrupted-run cleanup.
    scheduler-name: dataScalpelTaskScheduler
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
      schema: classpath:db/quartz/task-qrtz-postgresql.sql
    wait-for-jobs-to-complete-on-shutdown: false

data-scalpel:
  system-mcp:
    public-base-url: ${DATASCALPEL_SYSTEM_MCP_PUBLIC_BASE_URL:}
    connect-timeout: 3s
    invoke-timeout: 60s
    concurrency: 8
    max-request-bytes: 2097152
    max-response-bytes: 1048576
    audit-retention: 30d
  operations:
    credential-key: ${DATASCALPEL_ALERT_CREDENTIAL_KEY:}
    public-base-url: ${DATASCALPEL_PUBLIC_BASE_URL:}
    observation-stale-after: 90s
    evaluation-interval: 10s
    incident-retention-days: 90
    notification-retention-days: 30
    delivery-retention-days: 30
    signal-retention-days: 7
  mcp:
    public-base-url: ${DATASCALPEL_MCP_PUBLIC_BASE_URL:http://localhost:${server.port}}
    credential-key: ${DATASCALPEL_MCP_CREDENTIAL_KEY:}
    execution-timeout: ${DATASCALPEL_MCP_EXECUTION_TIMEOUT:10s}
    execution-concurrency: ${DATASCALPEL_MCP_EXECUTION_CONCURRENCY:8}
    execution-queue-capacity: ${DATASCALPEL_MCP_EXECUTION_QUEUE_CAPACITY:32}
    max-script-size: ${DATASCALPEL_MCP_MAX_SCRIPT_SIZE:200KB}
    max-schema-size: ${DATASCALPEL_MCP_MAX_SCHEMA_SIZE:64KB}
    max-payload-size: ${DATASCALPEL_MCP_MAX_PAYLOAD_SIZE:1MB}
    max-tools-per-server: ${DATASCALPEL_MCP_MAX_TOOLS_PER_SERVER:100}
    invocation-retention: ${DATASCALPEL_MCP_INVOCATION_RETENTION:30d}
    invocation-cleanup-cron: ${DATASCALPEL_MCP_INVOCATION_CLEANUP_CRON:0 45 3 * * *}
  assistant:
    credential-key: ${DATASCALPEL_ASSISTANT_CREDENTIAL_KEY:}
    connect-timeout: ${DATASCALPEL_ASSISTANT_CONNECT_TIMEOUT:5s}
    request-timeout: ${DATASCALPEL_ASSISTANT_REQUEST_TIMEOUT:90s}
    stale-run-timeout: ${DATASCALPEL_ASSISTANT_STALE_RUN_TIMEOUT:2m}
    max-output-tokens: ${DATASCALPEL_ASSISTANT_MAX_OUTPUT_TOKENS:4096}
    temperature: ${DATASCALPEL_ASSISTANT_TEMPERATURE:0.1}
    max-tool-rounds: 4
    max-tool-calls-per-turn: 8
    max-directory-operations: 100
  gateway-access:
    enabled: ${DATASCALPEL_GATEWAY_ACCESS_ENABLED:false}
    topic: ${DATASCALPEL_GATEWAY_ACCESS_TOPIC:datascalpel.gateway.access.v1}
    consumer-group: ${DATASCALPEL_GATEWAY_ACCESS_CONSUMER_GROUP:data-scalpel-admin-gateway-access-v1}
    concurrency: ${DATASCALPEL_GATEWAY_ACCESS_CONCURRENCY:2}
    max-poll-records: ${DATASCALPEL_GATEWAY_ACCESS_MAX_POLL_RECORDS:500}
    raw-retention: ${DATASCALPEL_GATEWAY_ACCESS_RAW_RETENTION:7d}
    hourly-retention: ${DATASCALPEL_GATEWAY_ACCESS_HOURLY_RETENTION:180d}
    archive-max-hours: ${DATASCALPEL_GATEWAY_ACCESS_ARCHIVE_MAX_HOURS:24}
    cleanup-batch-size: ${DATASCALPEL_GATEWAY_ACCESS_CLEANUP_BATCH_SIZE:10000}
    cleanup-max-batches: ${DATASCALPEL_GATEWAY_ACCESS_CLEANUP_MAX_BATCHES:100}
    archive-cron: ${DATASCALPEL_GATEWAY_ACCESS_ARCHIVE_CRON:0 5 * * * *}
    raw-cleanup-cron: ${DATASCALPEL_GATEWAY_ACCESS_RAW_CLEANUP_CRON:0 25 * * * *}
    hourly-cleanup-cron: ${DATASCALPEL_GATEWAY_ACCESS_HOURLY_CLEANUP_CRON:0 35 2 * * *}
  execution:
    kafka:
      consumer-group: ${DATASCALPEL_EXECUTION_KAFKA_CONSUMER_GROUP:data-scalpel-admin-execution-v1}
      admin-event-topics: ${DATASCALPEL_EXECUTION_KAFKA_ADMIN_EVENT_TOPICS:datascalpel.execution.event}
      invalid-message-topic: ${DATASCALPEL_EXECUTION_KAFKA_INVALID_MESSAGE_TOPIC:datascalpel.execution.invalid-message.v1}
      outbox-batch-size: ${DATASCALPEL_EXECUTION_KAFKA_OUTBOX_BATCH_SIZE:50}
      outbox-poll-interval: ${DATASCALPEL_EXECUTION_KAFKA_OUTBOX_POLL_INTERVAL:500ms}
      send-timeout: ${DATASCALPEL_EXECUTION_KAFKA_SEND_TIMEOUT:120s}
      claim-timeout: ${DATASCALPEL_EXECUTION_KAFKA_CLAIM_TIMEOUT:1m}
  file-parsing:
    temporary-directory: ${DATASCALPEL_FILE_PARSING_TEMPORARY_DIRECTORY:${java.io.tmpdir}/data-scalpel/file-parsing}
    max-sampled-uncompressed-size: ${DATASCALPEL_FILE_PARSING_MAX_SAMPLED_UNCOMPRESSED_SIZE:64MB}
    max-validated-uncompressed-size: ${DATASCALPEL_FILE_PARSING_MAX_VALIDATED_UNCOMPRESSED_SIZE:2GB}
    max-materialized-size: ${DATASCALPEL_FILE_PARSING_MAX_MATERIALIZED_SIZE:1GB}
    orphan-retention: ${DATASCALPEL_FILE_PARSING_ORPHAN_RETENTION:24h}
    gdb:
      max-entries: ${DATASCALPEL_GDB_ZIP_MAX_ENTRIES:10000}
      max-entry-size: ${DATASCALPEL_GDB_ZIP_MAX_ENTRY_SIZE:1GB}
      max-expanded-size: ${DATASCALPEL_GDB_ZIP_MAX_EXPANDED_SIZE:4GB}
      max-compression-ratio: ${DATASCALPEL_GDB_ZIP_MAX_COMPRESSION_RATIO:200}
    shp:
      max-entries: ${DATASCALPEL_SHP_ZIP_MAX_ENTRIES:256}
      max-entry-size: ${DATASCALPEL_SHP_ZIP_MAX_ENTRY_SIZE:1GB}
      max-expanded-size: ${DATASCALPEL_SHP_ZIP_MAX_EXPANDED_SIZE:4GB}
      max-compression-ratio: ${DATASCALPEL_SHP_ZIP_MAX_COMPRESSION_RATIO:200}
      max-preview-geometry-points-per-feature: ${DATASCALPEL_SHP_MAX_PREVIEW_GEOMETRY_POINTS_PER_FEATURE:100000}
      max-preview-total-geometry-points: ${DATASCALPEL_SHP_MAX_PREVIEW_TOTAL_GEOMETRY_POINTS:200000}
  service-engine:
    credential-key: ${DATASCALPEL_SERVICE_ENGINE_CREDENTIAL_KEY:}
  service-gateway:
    provider: ${DATASCALPEL_SERVICE_GATEWAY_PROVIDER:none}
    kong:
      admin-url: ${DATASCALPEL_KONG_ADMIN_URL:}
      proxy-url: ${DATASCALPEL_KONG_PROXY_URL:}
      connect-timeout: ${DATASCALPEL_KONG_CONNECT_TIMEOUT:3s}
      request-timeout: ${DATASCALPEL_KONG_REQUEST_TIMEOUT:5s}
    super-api-gateway:
      admin-url: ${DATASCALPEL_SUPER_API_GATEWAY_ADMIN_URL:}
      proxy-url: ${DATASCALPEL_SUPER_API_GATEWAY_PROXY_URL:}
      machine-token: ${DATASCALPEL_SUPER_API_GATEWAY_MACHINE_TOKEN:}
      connect-timeout: ${DATASCALPEL_SUPER_API_GATEWAY_CONNECT_TIMEOUT:3s}
      request-timeout: ${DATASCALPEL_SUPER_API_GATEWAY_REQUEST_TIMEOUT:5s}
      upstream-connect-timeout: ${DATASCALPEL_SUPER_API_GATEWAY_UPSTREAM_CONNECT_TIMEOUT:3s}
      upstream-response-timeout: ${DATASCALPEL_SUPER_API_GATEWAY_UPSTREAM_RESPONSE_TIMEOUT:35s}
  task-engine:
    token: ${DATASCALPEL_TASK_ENGINE_TOKEN:}
    connect-timeout: ${DATASCALPEL_TASK_ENGINE_CONNECT_TIMEOUT:3s}
    request-timeout: ${DATASCALPEL_TASK_ENGINE_REQUEST_TIMEOUT:35s}
  compute-engine:
    credential-key: ${DATASCALPEL_COMPUTE_ENGINE_CREDENTIAL_KEY:}
    connect-timeout: ${DATASCALPEL_COMPUTE_ENGINE_CONNECT_TIMEOUT:3s}
    request-timeout: ${DATASCALPEL_COMPUTE_ENGINE_REQUEST_TIMEOUT:10s}
  datasource:
    credential-key: ${DATASCALPEL_DATA_SOURCE_CREDENTIAL_KEY:}
  file-storage:
    s3:
      region: ${DATASCALPEL_FILE_STORAGE_REGION:us-east-1}
      bucket: ${DATASCALPEL_FILE_STORAGE_BUCKET:datascalpel}
      root-prefix: ${DATASCALPEL_FILE_STORAGE_ROOT_PREFIX:data-scalpel}
      path-style-access: ${DATASCALPEL_FILE_STORAGE_PATH_STYLE_ACCESS:true}
      runner-endpoint: ${DATASCALPEL_FILE_STORAGE_RUNNER_ENDPOINT:}
  task-run:
    canvas:
      timeout: ${DATASCALPEL_CANVAS_TASK_TIMEOUT:1h}
      recovery-grace: ${DATASCALPEL_CANVAS_RECOVERY_GRACE:1m}
    model-quality:
      timeout: ${DATASCALPEL_MODEL_QUALITY_TASK_TIMEOUT:1h}
    executor:
      concurrency: ${DATASCALPEL_TASK_RUN_CONCURRENCY:4}
      queue-capacity: ${DATASCALPEL_TASK_RUN_QUEUE_CAPACITY:100}
  task:
    snapshot-sync:
      max-rows-per-side: ${DATASCALPEL_SNAPSHOT_SYNC_MAX_ROWS_PER_SIDE:100000}
      max-estimated-bytes: ${DATASCALPEL_SNAPSHOT_SYNC_MAX_ESTIMATED_BYTES:268435456}
      lock-timeout-seconds: ${DATASCALPEL_SNAPSHOT_SYNC_LOCK_TIMEOUT_SECONDS:30}
  security:
    admin:
      username: ${DATASCALPEL_ADMIN_USERNAME:admin}
      password: ${DATASCALPEL_ADMIN_PASSWORD:admin123456}
    jwt:
      issuer: ${DATASCALPEL_JWT_ISSUER:data-scalpel-admin}
      secret: ${DATASCALPEL_JWT_SECRET:change-me-data-scalpel-development-secret-key-32-bytes}
      time-to-live: ${DATASCALPEL_JWT_TTL:8h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    version: '@project.version@'

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
